openapi: 3.0.3
info:
  title: FPTU Lost & Found Node API
  version: 0.1.0
servers:
  - url: http://localhost:3001/api
paths:
  /health:
    get:
      summary: Process liveness check
      responses:
        "200":
          description: Service status
  /health/live:
    get:
      summary: Process liveness check for orchestrators
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      summary: Dependency-aware readiness check for database, matching queue and optional Redis
      responses:
        "200":
          description: Service is ready
        "503":
          description: One or more required dependencies are unavailable
  /metrics:
    get:
      summary: Prometheus-compatible operational metrics
      responses:
        "200":
          description: Metrics text
        "403":
          description: Invalid metrics token
        "404":
          description: Metrics are hidden in production when no token is configured
  /auth/register:
    post:
      summary: Register account after validating registration OTP
      responses:
        "201":
          description: Registration completed
  /auth/register/request-otp:
    post:
      summary: Send registration OTP before account creation
      responses:
        "200":
          description: Registration OTP sent
  /auth/verify-otp:
    post:
      summary: Verify registration OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: '^\d{6}$'
                accountType:
                  type: string
                  enum: [STUDENT, LECTURER]
                  default: STUDENT
      responses:
        "200":
          description: Email verified and token pair issued
  /auth/resend-otp:
    post:
      summary: Resend registration OTP for a pending account
      responses:
        "200":
          description: Verification OTP resent
  /auth/login:
    post:
      summary: Login with email and password
      responses:
        "200":
          description: Token pair issued
  /auth/forgot-password:
    post:
      summary: Request password reset OTP
      responses:
        "200":
          description: Password reset OTP requested
  /auth/reset-password:
    post:
      summary: Reset password with OTP
      responses:
        "200":
          description: Password reset successful
  /auth/refresh:
    post:
      summary: Rotate refresh token
      responses:
        "200":
          description: New token pair issued
  /auth/logout:
    post:
      security:
        - bearerAuth: []
      summary: Revoke refresh token
      responses:
        "200":
          description: Refresh token revoked
  /auth/me:
    get:
      security:
        - bearerAuth: []
      summary: Get current user
      responses:
        "200":
          description: Current user
  /auth/profile:
    put:
      security:
        - bearerAuth: []
      summary: Update current user profile
      responses:
        "200":
          description: Updated profile
  /auth/avatar:
    post:
      security:
        - bearerAuth: []
      summary: Upload current user avatar
      responses:
        "200":
          description: Avatar uploaded
  /auth/activity:
    get:
      security:
        - bearerAuth: []
      summary: Get current user activity
      responses:
        "200":
          description: Activity list
  /auth/reputation:
    get:
      security:
        - bearerAuth: []
      summary: Get current user reputation
      responses:
        "200":
          description: Reputation summary
  /admin/dashboard/overview:
    get:
      security:
        - bearerAuth: []
      summary: Admin dashboard overview metrics
      responses:
        "200":
          description: Admin overview
  /admin/users:
    get:
      security:
        - bearerAuth: []
      summary: Admin list users
      responses:
        "200":
          description: User list
  /admin/categories:
    get:
      security:
        - bearerAuth: []
      summary: Admin list categories
      responses:
        "200":
          description: Category list
    post:
      security:
        - bearerAuth: []
      summary: Admin create category
      responses:
        "201":
          description: Category created
  /admin/locations/areas:
    get:
      security:
        - bearerAuth: []
      summary: Admin list campus areas
      responses:
        "200":
          description: Area list
    post:
      security:
        - bearerAuth: []
      summary: Admin create campus area
      responses:
        "201":
          description: Area created
  /admin/locations/buildings:
    get:
      security:
        - bearerAuth: []
      summary: Admin list campus buildings
      responses:
        "200":
          description: Building list
    post:
      security:
        - bearerAuth: []
      summary: Admin create campus building
      responses:
        "201":
          description: Building created
  /admin/locations/rooms:
    get:
      security:
        - bearerAuth: []
      summary: Admin list campus rooms
      responses:
        "200":
          description: Room list
    post:
      security:
        - bearerAuth: []
      summary: Admin create campus room
      responses:
        "201":
          description: Room created
  /admin/handover-points:
    get:
      security:
        - bearerAuth: []
      summary: Admin list handover points
      description: Returns handover points with mapImageUrl, mapPositionX/Y and storedItems counted from active warehouse items.
      responses:
        "200":
          description: Handover point list
    post:
      security:
        - bearerAuth: []
      summary: Admin create handover point
      description: Creates a handover point and can persist campus map image data/URL plus marker coordinates in percentages.
      responses:
        "201":
          description: Handover point created
  /posts:
    post:
      security:
        - bearerAuth: []
      summary: Create LOST or FOUND post
      responses:
        "201":
          description: Post created
    get:
      summary: List public posts with pagination and filters
      responses:
        "200":
          description: Post list
  /posts/ai-draft:
    post:
      security:
        - bearerAuth: []
      summary: Create an ephemeral AI-assisted post draft from one image
      description: Uses Google Vision assisted OCR/tags when available; user review is required and no draft is persisted.
      responses:
        "200":
          description: Editable draft with honest provider or fallback status
        "422":
          description: Invalid or unsafe image
  /posts/finder-quick-scan:
    post:
      security:
        - bearerAuth: []
      summary: Analyze one finder-selected image and create an idempotent FOUND draft session
      description: Uses Google Vision assisted OCR/tags or filter fallback. Raw image and raw OCR are not persisted.
      responses:
        "200":
          description: Draft session and redacted LOST candidate summaries
        "422":
          description: Invalid or unsafe image
  /posts/finder-quick-scan/{sessionId}/create-draft:
    post:
      security:
        - bearerAuth: []
      summary: Confirm a candidate and prepare an editable FOUND draft
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Draft ready for human review
  /posts/finder-quick-scan/{sessionId}/publish:
    post:
      security:
        - bearerAuth: []
      summary: Publish one FOUND post from a transaction-locked scan session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Existing post returned for an idempotent retry
        "201":
          description: FOUND post created
  /proof-vault:
    get:
      security:
        - bearerAuth: []
      summary: List current user's private proofs
      responses:
        "200":
          description: Owner-only proof list without raw storage identifiers
    post:
      security:
        - bearerAuth: []
      summary: Create a private ownership proof
      responses:
        "201":
          description: Secret value is write-only and hashed
  /proof-vault/{id}:
    patch:
      security:
        - bearerAuth: []
      summary: Update an active owned proof
      responses:
        "200":
          description: Private proof updated
    delete:
      security:
        - bearerAuth: []
      summary: Archive proof without breaking claim history
      responses:
        "200":
          description: Private proof archived
  /proof-vault/{id}/media:
    get:
      security:
        - bearerAuth: []
      summary: Stream owner-only proof media through an authenticated proxy
      responses:
        "200":
          description: Protected image stream
    post:
      security:
        - bearerAuth: []
      summary: Upload or replace private proof media
      responses:
        "201":
          description: Private proof media stored
  /posts/my:
    get:
      security:
        - bearerAuth: []
      summary: List current user's posts
      responses:
        "200":
          description: Post list
  /posts/{id}:
    get:
      summary: Get post detail
      responses:
        "200":
          description: Post detail
    put:
      security:
        - bearerAuth: []
      summary: Update post
      responses:
        "200":
          description: Post updated
    delete:
      security:
        - bearerAuth: []
      summary: Soft-delete post
      responses:
        "200":
          description: Post deleted
  /posts/{id}/search-companion:
    get:
      security:
        - bearerAuth: []
      summary: Get the owner-only private search profile and next question
      responses:
        "200":
          description: Search profile without FOUND private details
        "403":
          description: Not the active LOST post owner
  /posts/{id}/search-companion/answers:
    post:
      security:
        - bearerAuth: []
      summary: Save one private Search Companion answer
      responses:
        "200":
          description: Search profile revision updated
  /posts/{id}/search-companion/skip:
    post:
      security:
        - bearerAuth: []
      summary: Skip one Search Companion question
      responses:
        "200":
          description: Question skipped
  /posts/{id}/search-companion/undo:
    post:
      security:
        - bearerAuth: []
      summary: Remove the most recently saved Search Companion answer
      responses:
        "200":
          description: Last answer removed
  /posts/{id}/search-companion/recalculate:
    post:
      security:
        - bearerAuth: []
      summary: Preview matching score changes without writing matches or statuses
      responses:
        "200":
          description: Backend-redacted candidates and score deltas
  /posts/{id}/search-companion/apply:
    post:
      security:
        - bearerAuth: []
      summary: Apply confirmed non-secret fields to the public LOST post
      responses:
        "200":
          description: Post updated while private answers remain private
  /posts/{id}/recovery-timeline:
    get:
      security:
        - bearerAuth: []
      summary: Get an authorized recovery timeline from business and audit records
      responses:
        "200":
          description: Stable privacy-safe timeline
        "403":
          description: Not a participant or reviewer
  /posts/{id}/media:
    post:
      security:
        - bearerAuth: []
      summary: Upload post images
      responses:
        "201":
          description: Post media uploaded
  /posts/{id}/media/{mediaId}:
    delete:
      security:
        - bearerAuth: []
      summary: Delete post media
      responses:
        "200":
          description: Post media deleted
  /posts/{id}/matches:
    get:
      security:
        - bearerAuth: []
      summary: Get post matching results
      responses:
        "200":
          description: Match result list
  /posts/{id}/status:
    patch:
      security:
        - bearerAuth: []
      summary: Update post status
      responses:
        "200":
          description: Post status updated
  /posts/{id}/claims:
    get:
      security:
        - bearerAuth: []
      summary: List claims for a post
      responses:
        "200":
          description: Claim list
  /search:
    get:
      summary: Search public posts
      responses:
        "200":
          description: Search results
  /claims:
    post:
      security:
        - bearerAuth: []
      summary: Submit claim for a FOUND post
      responses:
        "201":
          description: Claim submitted
  /claims/{id}:
    get:
      security:
        - bearerAuth: []
      summary: Get claim detail
      responses:
        "200":
          description: Claim detail
  /claims/{id}/consistency-map:
    get:
      security:
        - bearerAuth: []
      summary: Reviewer-only Evidence Consistency Map
      description: Advisory evidence consistency signals; human decision required.
      responses:
        "200":
          description: Evidence consistency signals
        "403":
          description: Reviewer authorization required
  /claims/{id}/proof-vault:
    get:
      security:
        - bearerAuth: []
      summary: List private proofs attached to an authorized claim
      responses:
        "200":
          description: Attached proof snapshots without raw storage identifiers
  /claims/{id}/proof-vault/{proofId}:
    post:
      security:
        - bearerAuth: []
      summary: Claimant attach an owned active proof
      responses:
        "201":
          description: Proof attached transactionally
    delete:
      security:
        - bearerAuth: []
      summary: Claimant detach proof while claim is editable
      responses:
        "200":
          description: Proof detached
  /claims/{id}/proof-vault/{proofId}/media:
    get:
      security:
        - bearerAuth: []
      summary: Stream attached proof media for claim participants or reviewers
      responses:
        "200":
          description: Protected image stream
        "403":
          description: Not a participant or reviewer
  /claims/{id}/evidence:
    post:
      security:
        - bearerAuth: []
      summary: Upload claim evidence image
      responses:
        "201":
          description: Claim evidence uploaded
  /config/public:
    get:
      summary: Get public configuration entries
      responses:
        "200":
          description: Public config list
  /categories:
    get:
      summary: List active categories
      responses:
        "200":
          description: Category list
  /locations/areas:
    get:
      summary: List active campus areas
      responses:
        "200":
          description: Area list
  /locations/areas/{id}/buildings:
    get:
      summary: List active buildings in an area
      responses:
        "200":
          description: Building list
  /locations/buildings/{id}/rooms:
    get:
      summary: List active rooms in a building
      responses:
        "200":
          description: Room list
  /handover-points:
    get:
      summary: List active handover points
      description: Returns active handover points with map image/marker coordinates and stored item counts.
      responses:
        "200":
          description: Handover point list
  /handover-points/{id}:
    get:
      summary: Get active handover point detail
      description: Returns one active handover point with map image/marker coordinates and stored item count.
      responses:
        "200":
          description: Handover point detail
  /posts/{id}/verification-questions/suggest:
    post:
      security:
        - bearerAuth: []
      summary: Suggest private verification questions for a FOUND post
      description: Returns deterministic item/category/OCR-aware suggestions. It never returns an expected answer.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Question suggestions }
        "403": { description: Only the post owner, Staff or Admin may manage questions }
  /posts/{id}/verification-questions:
    get:
      security:
        - bearerAuth: []
      summary: List verification questions visible to the current actor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Redacted verification-question list }
    post:
      security:
        - bearerAuth: []
      summary: Create a reviewer-approved verification question
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, questionType, sourceSignal, expectedAnswer]
              properties:
                prompt: { type: string, minLength: 8, maxLength: 500 }
                questionType: { type: string, enum: [TEXT, MASKED_SERIAL, MULTIPLE_CHOICE, VISUAL_DETAIL] }
                sourceSignal: { type: string }
                expectedAnswer: { type: string, writeOnly: true }
                options:
                  type: array
                  minItems: 2
                  maxItems: 8
                  items: { type: string }
                weight: { type: number, minimum: 0.1, maximum: 1, default: 0.5 }
                privacyLevel: { type: string, enum: [PRIVATE, HIGHLY_PRIVATE] }
                approved: { type: boolean, default: false }
      responses:
        "201": { description: Question saved with a hashed expected answer }
  /posts/{id}/verification-questions/{questionId}/status:
    patch:
      security:
        - bearerAuth: []
      summary: Approve or disable a verification question
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, DISABLED] }
      responses:
        "200": { description: Question status updated }
  /claims/{id}/verification-questions:
    get:
      security:
        - bearerAuth: []
      summary: List version-pinned verification questions for a claim
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Claimant-safe or reviewer-safe question view according to role }
  /claims/{id}/verification-questions/{questionId}/answer:
    post:
      security:
        - bearerAuth: []
      summary: Submit a private verification answer
      description: The claimant never receives the expected answer or a correctness result.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, minLength: 1, maxLength: 500, writeOnly: true }
      responses:
        "200": { description: Answer accepted for review }
        "429": { description: Attempt limit reached }
  /admin/radar/events:
    get:
      security:
        - bearerAuth: []
      summary: List sourced campus events for Radar
      responses:
        "200": { description: Staff/Admin event list }
    post:
      security:
        - bearerAuth: []
      summary: Create a sourced campus event (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType, sourceType, sourceReference, startsAt, endsAt]
              properties:
                eventType: { type: string, enum: [ACADEMIC, SPORTS, CULTURAL, CAMPUS_OPERATIONS, WEATHER, OTHER] }
                sourceType: { type: string, enum: [OFFICIAL_CALENDAR, CAMPUS_NOTICE, SECURITY_LOG, WEATHER_BULLETIN] }
                sourceReference: { type: string, minLength: 3, maxLength: 255 }
                areaId: { type: string, format: uuid, nullable: true }
                buildingId: { type: string, format: uuid, nullable: true }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
      responses:
        "201": { description: Event created }
        "403": { description: Admin role required }
  /admin/radar/events/{id}/analyze:
    post:
      security:
        - bearerAuth: []
      summary: Analyze LOST anomalies for a sourced event (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Sliding-window analysis result }
  /admin/radar/alerts:
    get:
      security:
        - bearerAuth: []
      summary: List privacy-preserving Campus Radar alerts
      responses:
        "200": { description: Staff/Admin alert list }
  /admin/radar/alerts/{id}/status:
    patch:
      security:
        - bearerAuth: []
      summary: Acknowledge, resolve or dismiss a Radar alert
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [ACKNOWLEDGED, RESOLVED, DISMISSED] }
                reason: { type: string, enum: [REVIEWED_NO_ACTION, MONITORING, OPERATIONAL_FOLLOW_UP, FALSE_POSITIVE] }
      responses:
        "200": { description: Alert disposition updated }
  /admin/radar/alerts/{id}/posts:
    get:
      security:
        - bearerAuth: []
      summary: List public post summaries in a Radar alert scope
      description: Returns only LOST post identifiers, titles, status, time, category and campus location; no contact, media, evidence or OCR data.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: Staff/Admin related post summaries }
        "403": { description: Staff/Admin role required }
        "404": { description: Radar alert not found }
  /admin/radar/audit:
    get:
      security:
        - bearerAuth: []
      summary: Get Campus Radar audit data (Admin only)
      responses:
        "200": { description: Radar audit data }
  /admin/visual-hunt:
    post:
      security:
        - bearerAuth: []
      summary: Rank LOST candidates from one explicit Staff/Admin scan image
      description: Accepts a captured frame or uploaded image. Raw input is not persisted and no post state changes automatically.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                targetType: { type: string, enum: [LOST, FOUND], default: LOST }
                categoryId: { type: string, format: uuid }
                areaId: { type: string, format: uuid }
                maxResults: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        "200": { description: Ranked candidate cards with advisory signals }
        "400": { description: Invalid type, signature, size or request }
        "403": { description: Staff/Admin role required }
  /admin/visual-hunt/feedback:
    post:
      security:
        - bearerAuth: []
      summary: Record Staff/Admin Visual Hunt candidate feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postId, decision, source]
              properties:
                postId: { type: string, format: uuid }
                decision: { type: string, enum: [CANDIDATE, NOT_RELEVANT] }
                similarityScore: { type: number, minimum: 0, maximum: 1, nullable: true }
                source: { type: string, enum: [CAMERA, IMAGE, VIDEO_FRAMES, BATCH_IMAGES] }
      responses:
        "200": { description: Feedback recorded without changing item status }
  /docs:
    get:
      summary: OpenAPI document
      responses:
        "200":
          description: OpenAPI JSON
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
